<svg xmlns="http://www.w3.org/2000/svg" width="300" height="68" viewBox="0 3 300 68" role="img" aria-labelledby="title desc">
  <title id="title">OAA Next</title>
  <desc id="desc">OAA Next wordmark with an interlaced green O and purple A, followed by a blue Next</desc>

  <defs>
    <!-- The O passes over the first A at the upper crossing.  This clip
         redraws the lower A stroke over the O to complete the weave. -->
    <clipPath id="lower-a-crossing">
      <rect x="19" y="39" width="42" height="28"/>
    </clipPath>
  </defs>

  <g transform="translate(36 0)">
    <g font-family="Avenir Next, Segoe UI, DejaVu Sans, sans-serif" font-size="52" font-weight="500">
      <text x="24" y="59" fill="#783c96" letter-spacing="-2">AA</text>
      <text x="4" y="59" fill="#237a3b">O</text>
      <text x="24" y="59" fill="#783c96" clip-path="url(#lower-a-crossing)">A</text>
    </g>
    <text x="99" y="59" fill="#247f9e"
          font-family="Avenir Next, Segoe UI, DejaVu Sans, sans-serif"
          font-size="52" font-weight="300" letter-spacing="1">Next</text>
  </g>
</svg>
